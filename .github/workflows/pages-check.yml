name: pages-check

# GitHub Pages の公開状態とURLの応答を確認する（手動実行用）
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Pages status
        run: |
          gh api "repos/${{ github.repository }}/pages" || echo "Pages: not enabled"
          gh api "repos/${{ github.repository }}/pages/builds/latest" --jq '{status, error, created_at}' || true
      - name: Site response
        run: |
          url="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "$url"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "$url"
