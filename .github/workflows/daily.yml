name: daily-scrape

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily.yml'
      - 'scraper/**'
      - 'docs/app.js'
      - 'docs/index.html'
      - 'docs/manual.md'
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST
  workflow_dispatch:
    inputs:
      max_pages:
        description: "取得ページ数の上限（0=全ページ。動作確認用）"
        default: "0"

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 定期実行はデフォルトブランチ上で起動するが、データは常に main に蓄積する
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Test parsers
        run: python -m unittest discover -s tests -t .

      - name: Scrape tabechoku
        id: scrape
        continue-on-error: true
        run: python -m scraper.scrape --debug-dump --report data/scrape-result.json --max-pages ${{ inputs.max_pages || 0 }}

      - name: Build dashboard data
        run: python -m scraper.build --through-yesterday

      - name: Upload raw HTML samples (parser debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Record update status
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python -m scraper.update_status --outcome "$SCRAPE_OUTCOME"

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots docs/data.js docs/update-status.json
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F) update (${{ steps.scrape.outcome }})"
          git push origin HEAD:main


      # GITHUB_TOKEN によるコミットだけでは Pages のビルドが起動しないため明示的に要求する
      - name: Publish dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      - name: Report scrape failure
        if: steps.scrape.outcome != 'success'
        run: |
          echo "データ取得に失敗しました。前回のデータと取得状況を公開しました。"
          exit 1

