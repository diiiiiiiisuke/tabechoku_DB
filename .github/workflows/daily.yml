name: daily-scrape

on:
  schedule:
    - cron: "0 20 * * *" # 毎日 05:00 JST
  workflow_dispatch:
    inputs:
      max_pages:
        description: "取得ページ数の上限（0=全ページ。動作確認用）"
        default: "0"

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 定期実行はデフォルトブランチ上で起動するが、データは常に main に蓄積する
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Test parsers
        run: python -m unittest discover -s tests -t .

      - name: Scrape tabechoku
        run: python -m scraper.scrape --debug-dump --max-pages ${{ inputs.max_pages || 0 }}

      - name: Build dashboard data
        run: python -m scraper.build

      - name: Upload raw HTML samples (parser debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots docs/data.js
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Tokyo date +%F) snapshot"
          git push origin HEAD:main
